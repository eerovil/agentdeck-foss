{# session header/status chip. `s` = Session. Re-rendered over SSE on flips. #}
<div class="session-head {{ s.status }}">
  <span class="dot {{ s.status }}{% if s.thinking %} thinking{% elif s.turn_failed %} failed{% endif %}"></span>
  <span class="session-title">{{ s.display_title }}</span>
  <span class="status-tag {{ s.display_state }}"{% if background_only %} data-background{% endif %}>{{ s.display_state }}</span>
  {% if s.subagent_count %}<span class="subagent-badge">{{ s.subagent_count }} sub-agent{{ '' if s.subagent_count == 1 else 's' }}</span>{% endif %}
</div>
